# Redeploy JobPilot frontend + API Container Apps on every push to main.
# Discovers the existing Azure apps after OIDC login; does not recreate infra.

name: Azure Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Login and redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME || secrets.AZURE_ACR_NAME }}
      AZURE_API_APP_NAME: ${{ vars.AZURE_API_APP_NAME || secrets.AZURE_API_APP_NAME }}
      AZURE_FRONTEND_APP_NAME: ${{ vars.AZURE_FRONTEND_APP_NAME || secrets.AZURE_FRONTEND_APP_NAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Azure OIDC configuration
        run: |
          missing=0
          for var in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing $var. Add it as a GitHub Actions variable or secret (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Redeploy frontend and backend
        run: ./scripts/azure-redeploy.sh
