apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobpilot-frontend
  namespace: jobpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobpilot-frontend
  template:
    metadata:
      labels:
        app: jobpilot-frontend
    spec:
      containers:
        - name: frontend
          image: jobpilot-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jobpilot-frontend
  namespace: jobpilot
spec:
  type: LoadBalancer
  selector:
    app: jobpilot-frontend
  ports:
    - port: 80
      targetPort: 80
