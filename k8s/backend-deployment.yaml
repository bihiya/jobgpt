apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobpilot-backend
  namespace: jobpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobpilot-backend
  template:
    metadata:
      labels:
        app: jobpilot-backend
    spec:
      containers:
        - name: backend
          image: jobpilot-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: jobpilot-secrets
            - configMapRef:
                name: jobpilot-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jobpilot-backend
  namespace: jobpilot
spec:
  selector:
    app: jobpilot-backend
  ports:
    - port: 8000
      targetPort: 8000
