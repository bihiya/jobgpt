services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - jobpilot_data:/tmp/jobpilot

  worker-fetch:
    build: ./backend
    command: python -m app.workers.fetch_worker
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - backend
      - kafka
    volumes:
      - jobpilot_data:/tmp/jobpilot

  worker-match:
    build: ./backend
    command: python -m app.workers.match_worker
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - backend
      - kafka

  worker-apply:
    build: ./backend
    command: python -m app.workers.apply_worker
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PLAYWRIGHT_HEADLESS: "true"
    depends_on:
      - backend
      - kafka
    volumes:
      - jobpilot_data:/tmp/jobpilot

  worker-notification:
    build: ./backend
    command: python -m app.workers.notification_worker
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - backend
      - kafka

  worker-report:
    build: ./backend
    command: python -m app.workers.report_worker
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - backend
      - kafka
    volumes:
      - jobpilot_data:/tmp/jobpilot

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  mongodb_data:
  jobpilot_data:
