<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JobPilot</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 14px; background: #f3f7f5; color: #14201c; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      label { display: block; font-size: 12px; margin-top: 8px; }
      input, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; border: 1px solid #c5d2cb; border-radius: 8px; }
      button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #0f6e56; color: white; font-weight: 600; cursor: pointer; }
      .msg { margin-top: 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Send to JobPilot AI</h1>
    <label>API base <input id="api" placeholder="http://localhost:8000/api/v1" /></label>
    <label>Access token <input id="token" type="password" placeholder="JWT access token" /></label>
    <label>Title <input id="title" /></label>
    <label>Company <input id="company" /></label>
    <label>Apply URL <input id="url" /></label>
    <button id="send">Send job</button>
    <button id="copyLi" type="button" style="background:#12352c;margin-top:8px">Copy LinkedIn li_at</button>
    <div class="msg" id="msg"></div>
    <script src="popup.js"></script>
  </body>
</html>
