[project]
name = "jobpilot-ai"
version = "1.0.0"
description = "JobPilot AI — FastAPI backend deployable on Vercel"
requires-python = ">=3.11"
# Vercel Python installs from pyproject.toml (not requirements.txt) when this file exists.
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic[email]>=2.10.0",
  "pydantic-settings>=2.6.0",
  "motor>=3.6.0",
  "beanie>=1.27.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.1,<4.1",
  "python-multipart>=0.0.17",
  "httpx>=0.28.0",
  "aiokafka>=0.12.0",
  "apscheduler>=3.10.4",
  "redis>=5.2.0",
  "prometheus-client>=0.21.0",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
  "aiofiles>=24.1.0",
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.1",
  "aiosmtplib>=3.0.2",
  "pyotp>=2.9.0",
]

# Vercel discovers FastAPI under backend/app/main.py (not a default root entrypoint).
# https://vercel.com/docs/frameworks/backend/fastapi#exporting-the-fastapi-application
[tool.vercel]
entrypoint = "backend.app.main:app"
