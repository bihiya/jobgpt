server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api/ {
        proxy_pass https://ca-jobpilot-api.bravebeach-7fcbe2c3.centralindia.azurecontainerapps.io/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ca-jobpilot-api.bravebeach-7fcbe2c3.centralindia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass https://ca-jobpilot-api.bravebeach-7fcbe2c3.centralindia.azurecontainerapps.io/health;
        proxy_ssl_server_name on;
        proxy_set_header Host ca-jobpilot-api.bravebeach-7fcbe2c3.centralindia.azurecontainerapps.io;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
